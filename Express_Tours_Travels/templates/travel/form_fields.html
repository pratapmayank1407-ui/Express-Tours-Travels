<div class="form-grid">
  {% for field in form %}
    <div class="field {% if field.name == 'message' %}field-full{% endif %}">
      <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span>*</span>{% endif %}</label>
      {{ field }}
      {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
      {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
    </div>
  {% endfor %}
</div>
